[package]
name = "dioxus-primitives"
version = "0.0.1"
edition = "2021"
rust-version = "1.80.0"
readme = "../README.md"
keywords = ["gui", "dioxus", "components", "primitives"]
categories = ["gui", "wasm"]
authors = ["Dioxus Labs", "DogeDark"]
license = "MIT OR Apache-2.0"
homepage = "https://dioxuslabs.com"
repository = "https://github.com/DioxusLabs/components"

[dependencies]
dioxus = "=0.8.0-alpha.3"
dioxus-attributes = { path = "../dioxus-attributes" }
dioxus-sdk-time = "=0.8.0-alpha.3"
time = { version = "0.3.44", features = ["std", "macros", "parsing", "local-offset"] }
num-integer = "0.1.46"
tracing = { version = "0.1", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
palette = "0.7.6"

[build-dependencies]
lazy-js-bundle = "=0.8.0-alpha.3"

[dev-dependencies]
dioxus-ssr = "=0.8.0-alpha.3"

[features]
default = ["router"]
router = ["dioxus/router"]
web = ["time/wasm-bindgen"]

# Hides warnings from code we vendor as-is: `use core::f32;` makes `f32::INFINITY` the deprecated
# module constant (select/text_search.rs). yakin-ui's test `vendor_lint_allow_still_needed`
# fails once that code is gone, so this allow is removed with it.
[lints.rust]
deprecated = "allow"
